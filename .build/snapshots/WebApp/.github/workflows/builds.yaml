---
name: builds
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  container-image:
    uses: Brownserve-UK/actions/.github/workflows/brownserve-pr-build.yaml@28d69596e4bcf98b0fe7f260c8ea2486265cd03a # v0.2.0
    permissions:
      contents: read
      pull-requests: read
    with:
      repo-name: 'test-web-app'
      change-pattern: '^(src/|Dockerfile|package\.json$|\.build/|\.config/|nuget\.config$)'
      build-task: ContainerImage.Check
      os-matrix: '["ubuntu-latest"]'

  # Gate job: always runs and reports the single status check name that branch protection requires.
  # Skipped and cancelled jobs fail it, path-filter skips are reported as successes by the called workflow.
  merge-checks:
    needs:
      - container-image
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: evaluate-build-results
        env:
          CONTAINER_IMAGE_RESULT: ${{ needs.container-image.result }}
        run: |
          FAILED=0
          if [ "$CONTAINER_IMAGE_RESULT" != "success" ]; then
            echo "container-image did not succeed (result: $CONTAINER_IMAGE_RESULT)"
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All required jobs succeeded"
