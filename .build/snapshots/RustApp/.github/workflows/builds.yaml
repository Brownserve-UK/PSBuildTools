---
name: builds
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  rust-binary:
    uses: Brownserve-UK/actions/.github/workflows/brownserve-pr-build.yaml@28d69596e4bcf98b0fe7f260c8ea2486265cd03a # v0.2.0
    permissions:
      contents: read
      pull-requests: read
    with:
      repo-name: 'test-rust-app'
      change-pattern: '^(Cargo\.toml$|Cargo\.lock$|.*\.rs$|\.build/|\.config/|nuget\.config$)'
      build-task: RustBinary.Check
      os-matrix: '["ubuntu-latest","windows-latest","macos-latest"]'
      rust: true

  # Gate job: always runs and reports the single status check name that branch protection requires.
  # Skipped and cancelled jobs fail it, path-filter skips are reported as successes by the called workflow.
  merge-checks:
    needs:
      - rust-binary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: evaluate-build-results
        env:
          RUST_BINARY_RESULT: ${{ needs.rust-binary.result }}
        run: |
          FAILED=0
          if [ "$RUST_BINARY_RESULT" != "success" ]; then
            echo "rust-binary did not succeed (result: $RUST_BINARY_RESULT)"
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All required jobs succeeded"
