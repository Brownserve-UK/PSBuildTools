---
name: builds
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build:
    uses: Brownserve-UK/actions/.github/workflows/brownserve-pr-build.yaml@73e2adb47b47bb461e804dd6c0038f5e4e513f89 # v0.1.0
    permissions:
      contents: read
      pull-requests: read
    with:
      repo-name: 'PSTools'
      change-pattern: '^(module/|pages/Cmdlet reference/|\.build/|\.config/|nuget\.config$)'
      build-task: BuildTestAndCheck
      os-matrix: '["ubuntu-latest"]'

  # Gate job: always runs and reports the single status check name that branch protection requires.
  # Skipped and cancelled jobs fail it, path-filter skips are reported as successes by the called workflow.
  merge-checks:
    needs:
      - build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: evaluate-build-results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          FAILED=0
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "build did not succeed (result: $BUILD_RESULT)"
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All required jobs succeeded"
