---
name: release
on:
  workflow_dispatch:
    inputs:
      publish_to:
        description: 'Where to publish the release to'
        required: true
        default: '"GitHub"'
        type: string

permissions: {}

jobs:
  release:
    uses: Brownserve-UK/actions/.github/workflows/brownserve-release.yaml@28d69596e4bcf98b0fe7f260c8ea2486265cd03a # v0.2.0
    permissions:
      contents: read
    with:
      repo-name: 'test-skills-repo'
      publish-to: ${{ inputs.publish_to }}
      node: true
    secrets:
      app-id: ${{ secrets.BROWNSERVE_CI_APP_ID }}
      app-private-key: ${{ secrets.BROWNSERVE_CI_APP_PRIVATE_KEY }}
      slack-webhook: ${{ secrets.SLACK_WEBHOOK_BUILD }}

  deploy-docs:
    needs: release
    uses: Brownserve-UK/actions/.github/workflows/brownserve-deploy-docs.yaml@28d69596e4bcf98b0fe7f260c8ea2486265cd03a # v0.2.0
    permissions:
      contents: write
    with:
      engine: astro
      docs-path: pages
