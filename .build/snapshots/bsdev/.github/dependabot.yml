---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    ignore:
      - dependency-name: "Brownserve-UK/actions*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30

  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
