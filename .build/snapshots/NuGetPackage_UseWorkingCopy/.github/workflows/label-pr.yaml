---
name: label-pr
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled
    branches:
      - main

permissions: {}

jobs:
  label-pr:
    uses: Brownserve-UK/actions/.github/workflows/brownserve-label-pr.yaml@28d69596e4bcf98b0fe7f260c8ea2486265cd03a # v0.2.0
    permissions:
      issues: write
      pull-requests: write
